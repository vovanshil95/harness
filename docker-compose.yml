services:
  # Прямое подключение, без прокси и туннеля.
  # DNS отдаёт для api.telegram.org адрес 149.154.166.110, который с этого
  # сервера мёртв (таймаут 12 с). Живой адрес того же Bot API — 149.154.167.220,
  # отвечает HTTP 302 за 0.19 с. Прибиваем его через extra_hosts, чтобы hermes
  # не уходил в DoH-перебор при неудачном резолве.
  hermes:
    image: nousresearch/hermes-agent:latest
    # ВРЕМЕННО hx-hermes-v2: старый контейнер hx-hermes завис так, что docker
    # держит устаревшую запись о нём и не отдаёт имя. Вернуть на hx-hermes
    # после ближайшей перезагрузки сервера, когда фантом исчезнет.
    container_name: hx-hermes-v2
    command: gateway run
    restart: on-failure:3
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    environment:
      # nginx создаёт заметки от uid 1000 и с правами 600, а образ hermes
      # по умолчанию работает от 10000 — в такие файлы он не попадает.
      # Права поменять не удалось (UMASK образ игнорирует), поэтому
      # выравниваем владельца: образ ремапит пользователя на старте.
      - PUID=1000
      - PGID=1000
      - HERMES_UID=1000
      - HERMES_GID=1000
    env_file:
      - .env
    volumes:
      - ./hermes-data:/opt/data
      # Живое хранилище Obsidian: его наполняет LiveSync через контейнер
      # obsidian. Внутри /opt/data, потому что HERMES_WRITE_SAFE_ROOT=/opt/data
      # — вне его агент не пишет. Для доступа только на чтение добавить :ro.
      - ./vault/me:/opt/data/vault
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 512
    cpus: 1.5

  # WebDAV для синхронизации Obsidian (плагин Remotely Save).
  # Образ собран под клиентов, которым штатного WebDAV-модуля nginx не хватает.
  # Подключён к infra_net, чтобы до него дотягивался caddy, который держит TLS.
  webdav:
    image: dgraziotin/nginx-webdav-nononsense:latest
    container_name: hx-webdav
    restart: on-failure:3
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - WEBDAV_USERNAME=${WEBDAV_USERNAME}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD}
    volumes:
      - ./webdav-data:/data
      - ./webdav-config:/config
    ports:
      - "127.0.0.1:8082:80"    # только для локальной проверки
    networks:
      - default
      - infra_net
    mem_limit: 256m
    pids_limit: 128
    cpus: 0.5

  # ── Второй пользователь ──────────────────────────────────────────────────
  # Отдельный бот и отдельный контейнер. Один токен нельзя опрашивать двумя
  # процессами (Telegram отдаёт 409), а изоляция волтов достигается тем, что
  # чужой каталог сюда просто не примонтирован.

  hermes2:
    image: nousresearch/hermes-agent:latest
    container_name: hx-hermes2
    command: gateway run
    restart: on-failure:3
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    environment:
      - PUID=1000
      - PGID=1000
      - HERMES_UID=1000
      - HERMES_GID=1000
      # Переопределяют одноимённые значения из .env (environment важнее env_file)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN2}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS2}
    env_file:
      - .env
    volumes:
      - ./hermes2-data:/opt/data
      - ./webdav2-data:/opt/data/vault
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 512
    cpus: 1.5

  webdav2:
    image: dgraziotin/nginx-webdav-nononsense:latest
    container_name: hx-webdav2
    restart: on-failure:3
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - WEBDAV_USERNAME=${WEBDAV2_USERNAME}
      - WEBDAV_PASSWORD=${WEBDAV2_PASSWORD}
    volumes:
      - ./webdav2-data:/data
      - ./webdav2-config:/config
    ports:
      - "127.0.0.1:8083:80"
    networks:
      - default
      - infra_net
    mem_limit: 256m
    pids_limit: 128
    cpus: 0.5

  # ── Obsidian LiveSync ─────────────────────────────────────────────
  # CouchDB — хранилище синхронизации. Obsidian на сервере — полноценный
  # клиент с тем же плагином: он раскладывает волт обычными .md на диск,
  # чтобы Hermes читал файлы напрямую, а не документы из базы.

  couchdb:
    image: couchdb:3
    container_name: hx-couchdb
    restart: on-failure:3
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - ./couchdb-data:/opt/couchdb/data
      - ./couchdb-config/local.ini:/opt/couchdb/etc/local.d/local.ini:ro
    ports:
      - "127.0.0.1:5984:5984"
    networks:
      - default
      - infra_net
    mem_limit: 1g
    pids_limit: 256
    cpus: 1.0

  obsidian:
    image: linuxserver/obsidian:latest
    container_name: hx-obsidian
    restart: on-failure:3
    security_opt:
      - seccomp:unconfined          # требуется Electron в контейнере
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
    volumes:
      - ./obsidian-config:/config
      - ./vault:/vaults              # сюда LiveSync кладёт .md, их читает Hermes
    ports:
      - "127.0.0.1:3010:3000"        # веб-интерфейс только через ssh-туннель
    shm_size: 1gb
    mem_limit: 2g
    pids_limit: 512
    cpus: 2.0

networks:
  infra_net:
    external: true
